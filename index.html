<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation - Nuray</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0e15;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Ortasyndaky Nuray ýazgysy */
        .heart-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3377;
            font-size: 5rem;
            font-weight: 800;
            z-index: 2;
            pointer-events: none;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 
                0 0 10px rgba(255, 51, 119, 0.8),
                0 0 20px rgba(255, 51, 119, 0.6),
                0 0 40px rgba(255, 51, 119, 0.4),
                0 0 80px rgba(255, 51, 119, 0.2);
            animation: heartBeat 1.8s infinite ease-in-out;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.85;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.12);
                opacity: 1;
                text-shadow: 
                    0 0 15px rgba(255, 51, 119, 1),
                    0 0 30px rgba(255, 51, 119, 0.8),
                    0 0 60px rgba(255, 51, 119, 0.6);
            }
        }

        svg {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <!-- Ortadaky Nuray ýazgysy -->
    <h1 class="heart-text">Nuray</h1>

    <!-- Wideodaky Heart SVG Path-y -->
    <svg viewBox="0 0 600 552">
        <path id="heart-path" d="M 300, 150 C 300, 70, 220, 20, 150, 20 C 70, 20, 20, 80, 20, 150 C 20, 260, 130, 360, 300, 500 C 470, 360, 580, 260, 580, 150 C 580, 80, 530, 20, 450, 20 C 380, 20, 300, 70, 300, 150 Z" />
    </svg>

    <!-- Three.js we GSAP (Wideodaky ýaly) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // Wideodaky kodyň edil özi:
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 600;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const path = document.querySelector("#heart-path");
        const length = path.getTotalLength();
        
        const vertices = [];
        const geometry = new THREE.BufferGeometry();

        // Wideodaky döredilen particle algoritmy
        const particleCount = 1800;
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const pointPercent = i / particleCount;
            const point = path.getPointAtLength(pointPercent * length);
            
            // X, Y, Z koordinatalary (Wideodaky formulalara takyk laýyk)
            positions[i * 3] = (point.x - 300) * 1.1;
            positions[i * 3 + 1] = -(point.y - 250) * 1.1;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Ýalpyldawuk nurly material
        const material = new THREE.PointsMaterial({
            color: 0xff2a75,
            size: 3.5,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Wideodaky GSAP animasiýasy:
        const posAttribute = geometry.attributes.position;
        const tl = gsap.timeline({ repeat: -1, yoyo: true });

        for (let i = 0; i < particleCount; i++) {
            const index = i * 3;
            
            gsap.to(posAttribute.array, {
                endArray: posAttribute.array,
                duration: 2 + Math.random() * 2,
                repeat: -1,
                yoyo: true,
                ease: "power2.inOut",
                onUpdate: () => {
                    // Partikllaryň yrgyly
                    posAttribute.array[index] += (Math.random() - 0.5) * 1.5;
                    posAttribute.array[index + 1] += (Math.random() - 0.5) * 1.5;
                    posAttribute.array[index + 2] += (Math.random() - 0.5) * 2;
                    posAttribute.needsUpdate = true;
                }
            });
        }

        // Aýlanma animasiýasy
        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.003;
            particles.rotation.z = Math.sin(Date.now() * 0.001) * 0.05;
            renderer.render(scene, camera);
        }

        animate();

        // Ekran ulalyp-kiçelende awtomatiki düzediş
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
